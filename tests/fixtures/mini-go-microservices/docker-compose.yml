services:
  auth:
    build: ./services/auth
    image: widgets-auth:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://widgets:widgets@postgres:5432/widgets
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
  orders:
    build: ./services/orders
    image: widgets-orders:latest
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://widgets:widgets@postgres:5432/widgets
      AUTH_URL: http://auth:8080
    depends_on:
      - auth
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: widgets
      POSTGRES_PASSWORD: widgets
      POSTGRES_DB: widgets
